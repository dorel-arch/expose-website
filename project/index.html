<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXPOSE — Homepage Mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #F5F2EE; }
  iframe { border: 0; display: block; background: #fff; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="browser-window.jsx"></script>

<script type="text/babel">
  const { useEffect, useState } = React;

  function MobilePreview() {
    return (
      <IOSDevice width={390} height={780}>
        <iframe
          src="site.html"
          style={{ width: '100%', height: '100%', borderRadius: 'inherit', background: '#fff' }}
          title="EXPOSE mobile"
        />
      </IOSDevice>
    );
  }

  function DesktopPreview() {
    return (
      <ChromeWindow url="expose.global" tabs={[{ title: 'EXPOSE — Stop Chasing Clients' }]} width={1280} height={820}>
        <iframe
          src="site.html"
          style={{ width: '100%', height: '100%', border: 0, background: '#fff' }}
          title="EXPOSE desktop"
        />
      </ChromeWindow>
    );
  }

  function App() {
    return (
      <DesignCanvas title="EXPOSE — Homepage">
        <DCSection id="mobile" title="Mobile · 390 × 780" subtitle="Matches the Figma mockup exactly. Scroll inside the frame to see the full page.">
          <DCArtboard id="mob-1" label="Home · Mobile" width={420} height={840}>
            <div style={{ width: '100%', height: '100%', display: 'grid', placeItems: 'center', background: 'transparent', padding: 14 }}>
              <MobilePreview />
            </div>
          </DCArtboard>
        </DCSection>
        <DCSection id="desktop" title="Desktop · 1280 wide" subtitle="Same page, responsive — scales up to a multi-column layout on larger screens.">
          <DCArtboard id="desk-1" label="Home · Desktop" width={1320} height={880}>
            <div style={{ width: '100%', height: '100%', display: 'grid', placeItems: 'center', background: 'transparent' }}>
              <DesktopPreview />
            </div>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
